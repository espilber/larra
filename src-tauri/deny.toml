# Keep ignore IDs in sync with src-tauri/.cargo/audit.toml (cargo-audit).

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
# Transitive GTK/unic/paste from Tauri/xberg; we cannot patch them here.
unmaintained = "workspace"
unsound = "workspace"
ignore = [
    # Transitive via xberg → biblib → quick-xml 0.37. Memory DoS on hostile XML.
    # Not RCE. Revisit when xberg bumps biblib.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.37 via xberg/biblib; quadratic attribute check DoS" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.37 via xberg/biblib; namespace allocation DoS" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
