# Windows NSIS (x64 Vulkan + ARM64 CPU). Does not run on push. Dispatch it
# once the version bump is on the remote:
#   gh workflow run release-windows.yml
#
# x64 Authenticode-signs during the NSIS build. ARM is built unsigned on
# windows-11-arm (Azure SignTool is x64), then signed on windows-latest.
# To sign an ARM installer from an earlier run without rebuilding:
#   gh workflow run release-windows.yml -f sign_arm_from_run=RUN_ID
#
# Secrets for Authenticode:
#   AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID,
#   AZURE_ARTIFACT_SIGNING_ENDPOINT, AZURE_ARTIFACT_SIGNING_ACCOUNT,
#   AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE
# Always needed for the in-app updater:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (optional)

name: Release Windows

on:
  workflow_dispatch:
    inputs:
      sign_arm_from_run:
        description: Skip builds; sign the ARM installer from this workflow run id
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  nsis:
    name: NSIS (${{ matrix.label }})
    if: ${{ inputs.sign_arm_from_run == '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: larra-windows-x64
            extra_args: ""
          - label: ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: larra-windows-arm64-unsigned
            extra_args: -SkipAuthenticode
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@v6
        # ARM64 is unsigned here; Authenticode runs on windows-latest in sign-arm64.
        if: ${{ matrix.extra_args == '' }}
        with:
          # Current LTS. artifact-signing-cli wants .NET 8 or newer.
          dotnet-version: "10.0.x"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: windows-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Install artifact-signing-cli
        if: ${{ matrix.extra_args == '' }}
        continue-on-error: true
        run: cargo install artifact-signing-cli
      - name: NSIS
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pwsh -File scripts/release-windows.ps1 -Target ${{ matrix.target }} ${{ matrix.extra_args }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
            src-tauri/target/updater/*.json
          if-no-files-found: error

  sign-arm64:
    name: Sign ARM64
    runs-on: windows-latest
    needs: [nsis]
    if: ${{ always() && (needs.nsis.result == 'success' || inputs.sign_arm_from_run != '') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@v6
        with:
          # Current LTS. artifact-signing-cli wants .NET 8 or newer.
          dotnet-version: "10.0.x"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - run: pnpm install --frozen-lockfile
      - name: Install artifact-signing-cli
        run: cargo install artifact-signing-cli
      - uses: actions/download-artifact@v8
        if: ${{ inputs.sign_arm_from_run == '' }}
        with:
          name: larra-windows-arm64-unsigned
          path: arm-in
      - name: Download unsigned ARM from another run
        if: ${{ inputs.sign_arm_from_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force arm-in | Out-Null
          $ok = $false
          foreach ($name in @("larra-windows-arm64-unsigned", "larra-windows-arm64")) {
            gh run download ${{ inputs.sign_arm_from_run }} --repo ${{ github.repository }} --name $name --dir arm-in
            if ($LASTEXITCODE -eq 0) {
              $ok = $true
              break
            }
          }
          if (-not $ok) { throw "Could not download an ARM installer from run ${{ inputs.sign_arm_from_run }}" }
      - name: Sign ARM NSIS
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pwsh -File scripts/sign-windows-nsis.ps1 -SearchDir arm-in
      - uses: actions/upload-artifact@v7
        with:
          name: larra-windows-arm64
          path: |
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.sig
            src-tauri/target/updater/*.json
          if-no-files-found: error
